name: circuit_solver
description: An Android app for solving electrical circuit questions from photos.
publish_to: "none"
version: 1.3.0+5

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.7.0
  flutter_math_fork: ^0.7.4
  image: ^4.3.0
  image_picker: ^1.1.2
  path_provider: ^2.1.4
  provider: ^6.1.2
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
