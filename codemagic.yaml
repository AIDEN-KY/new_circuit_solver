workflows:
  android-debug-build:
    name: Circuit Solver Android Debug APK
    instance_type: linux_x2
    max_build_duration: 30
    environment:
      flutter: stable
    scripts:
      - name: Generate Android platform files
        script: |
          flutter create --platforms=android --org com.example --project-name circuit_solver .
          mkdir -p android/app/src/main/kotlin/com/example/circuit_solver
          cp tool/android/MainActivity.kt android/app/src/main/kotlin/com/example/circuit_solver/MainActivity.kt
          cp tool/android/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
      - name: Get Flutter packages
        script: flutter pub get
      - name: Analyze project
        script: flutter analyze --no-fatal-infos
      - name: Run tests
        script: flutter test
      - name: Build debug APK
        script: flutter build apk --debug
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
